<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pure Cotton Sarees</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffdf9;--ink:#2a1840;--mute:#6b5a80;--card:#fff;--line:#eadfd0;--pink:#d81b60;--gold:#f5b301;--deep:#3b1f6b;--wa:#1faa59;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1026;--ink:#f6eefc;--mute:#bcaad0;--card:#271838;--line:#3d2a55}}
:root[data-theme="dark"]{--bg:#1a1026;--ink:#f6eefc;--mute:#bcaad0;--card:#271838;--line:#3d2a55}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Mukta,system-ui,sans-serif}
h1,h2,h3{font-family:"Yatra One",Georgia,serif;font-weight:400;line-height:1.15;margin:0}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.logo{font-family:"Yatra One",Georgia,serif;font-size:20px;color:var(--pink)}
.hbtn{background:var(--wa);color:#fff;border-radius:999px;padding:7px 14px;font-weight:700;text-decoration:none;white-space:nowrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{padding:30px 16px 0;max-width:960px;margin:auto}
.hero h1{font-size:clamp(32px,8.5vw,60px)}
.hero p{max-width:48ch;color:var(--mute);font-size:18px}
.temple{height:20px;margin:22px -16px 0;background:linear-gradient(135deg,var(--gold) 25%,transparent 25%) -10px 0,linear-gradient(225deg,var(--gold) 25%,transparent 25%) -10px 0;background-size:20px 20px;background-color:var(--deep)}
.wrap{max-width:960px;margin:auto;padding:22px 16px 90px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--deep);color:#fff;border-color:var(--deep)}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:4/5;background:var(--line);cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:2px 8px;font-size:13px}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.info h3{font-size:19px}.meta{display:flex;align-items:center;gap:6px;color:var(--mute)}
.price{font-weight:700}
.order{margin-top:auto;display:block;text-align:center;background:var(--wa);color:#fff;border-radius:9px;padding:10px;font-weight:700;text-decoration:none}
.order.off{background:var(--line);color:var(--mute);pointer-events:none}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--wa);box-shadow:0 4px 14px rgba(0,0,0,.35);display:grid;place-items:center;z-index:8}
footer{padding:22px 16px 90px;text-align:center;color:var(--mute);border-top:1px solid var(--line)}
.empty{color:var(--mute)}
</style>
</head>
<body>
<header><span class="logo" id="shop"></span><a class="hbtn" id="hwa" target="_blank" rel="noopener">WhatsApp</a></header>
<section class="hero">
<h1>Pure cotton sarees, new arrivals every day</h1>
<p>Pick the saree you like and tap Order on WhatsApp. Your message goes straight to the shop owner and he replies to you directly.</p>
<div class="temple" aria-hidden="true"></div>
</section>
<main class="wrap">
<div class="chips" id="chips" role="group" aria-label="Filter by colour"></div>
<div class="grid" id="grid"></div>
</main>
<footer id="foot"></footer>
<a class="fab" id="fab" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 2.5a9.5 9.5 0 0 0-8.2 14.3L2.5 21.5l4.8-1.3A9.5 9.5 0 1 0 12 2.5z"/><path fill="#1faa59" d="M8.7 7.6c-.4 3.9 2.9 7.3 7.1 7.7l1.1-1.8-2.2-1.2-1 .9c-1.1-.5-2.4-1.8-2.9-3l.9-1-1-2.4z"/></svg></a>
<script>
window.__DATA__=/*DATA*/null;
var $=function(i){return document.getElementById(i)};
(window.__DATA__?Promise.resolve(window.__DATA__):fetch("products.json?v="+Date.now()).then(function(r){return r.json()})).then(init).catch(function(){$("grid").innerHTML='<p class="empty">Could not load sarees. Please refresh the page.</p>'});
function init(D){
 var S=D.shop,L=D.sarees,pick="All";
 var wa=function(t){return "https://wa.me/"+S.whatsapp+"?text="+encodeURIComponent(t)};
 document.title=S.name;$("shop").textContent=S.name;
 $("hwa").href=$("fab").href=wa("Vanakkam "+S.owner+", I saw your saree website. I would like to know more.");
 $("foot").textContent=S.name+" · "+S.owner+" · WhatsApp +91 "+S.whatsapp.slice(-10);
 var cols=["All"];L.forEach(function(s){if(cols.indexOf(s.color)<0)cols.push(s.color)});
 function chips(){$("chips").innerHTML=cols.map(function(c){var s=L.filter(function(x){return x.color===c})[0];return '<button class="chip" aria-pressed="'+(c===pick)+'" data-c="'+c+'">'+(s?'<span class="dot" style="background:'+s.hex+'"></span>':'')+c+'</button>'}).join("")}
 function grid(){
  var a=L.filter(function(s){return pick==="All"||s.color===pick});
  $("grid").innerHTML=a.map(function(s){
   var msg="Vanakkam "+S.owner+", I want to order this saree: "+s.name+" ("+s.color+"), Code "+s.code+(s.price?", Price ₹"+s.price:"")+". Please share details.";
   return '<div class="card"><div class="ph" data-i="'+s.code+'" data-n="0"><img src="'+s.images[0]+'" alt="'+s.name+'" loading="lazy">'+(s.soldOut?'<span class="tag">Sold out</span>':s.images.length>1?'<span class="tag">Tap for next photo</span>':'')+'</div><div class="info"><h3>'+s.name+'</h3><div class="meta"><span class="dot" style="background:'+s.hex+'"></span>'+s.color+' · Code '+s.code+'</div><div class="price">'+(s.price?"₹"+s.price:"Price on WhatsApp")+'</div><a class="order'+(s.soldOut?" off":"")+'" target="_blank" rel="noopener" href="'+wa(msg)+'">'+(s.soldOut?"Sold out":"Order on WhatsApp")+'</a></div></div>'}).join("")||'<p class="empty">No sarees in this colour right now.</p>';
 }
 $("chips").onclick=function(e){var c=e.target.closest("[data-c]");if(c){pick=c.dataset.c;chips();grid()}};
 $("grid").onclick=function(e){var p=e.target.closest(".ph");if(!p)return;var s=L.filter(function(x){return x.code===p.dataset.i})[0];if(s.images.length<2)return;var n=(+p.dataset.n+1)%s.images.length;p.dataset.n=n;p.querySelector("img").src=s.images[n]};
 chips();grid();
}
</script>
</body>
</html>
